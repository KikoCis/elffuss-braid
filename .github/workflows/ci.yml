name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# The toolchain is pinned so that a new stable release, with new lints,
# never breaks the build by surprise: bump it on purpose.
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The git bridge round-trips this repository's own history, which a
          # shallow checkout does not have.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  wasm:
    name: format and engine on WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check -p elffuss-braid-format -p elffuss-braid-engine --target wasm32-unknown-unknown --locked

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  bench:
    name: benchmark smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The quick import scenario reads this repository's own history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      # Small inputs, only to keep the suite working: the ratios of a quick
      # run mean nothing, and its results stay on the runner, unpublished.
      - run: python3 bench/run.py --quick

  privacy:
    name: privacy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: scripts/privacy-check.sh

  spec:
    name: spec vectors (independent implementation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo install b3sum --locked
      - run: python3 docs/spec/check_vectors.py

  fuzz:
    name: fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: run every target for one minute
        working-directory: fuzz
        run: |
          for target in decode_tree decode_changeset names git_map git_objects; do
            cargo fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60
          done
