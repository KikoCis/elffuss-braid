[package]
name = "elffuss-braid-wc"
description = "Workspaces of elffuss-braid: safe checkouts, status, commit, land and update."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lib]
name = "braid_wc"

[dependencies]
braid-engine.workspace = true
braid-format.workspace = true
braid-repo.workspace = true
braid-store.workspace = true
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
crc32c = "0.6.8"
ignore = "0.4.33"
rayon = "1.12.0"
thiserror = "2.0"
unicode-normalization = "0.1.25"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
