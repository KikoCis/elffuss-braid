[package]
name = "elffuss-braid-repo"
description = "A braid repository on disk: discovery, opening, and resolving names to objects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lib]
name = "braid_repo"

[dependencies]
braid-format.workspace = true
braid-store.workspace = true
braid-git.workspace = true
braid-engine.workspace = true
blake3.workspace = true
# The local time zone, read without calling into the C library. Only the
# system's own time zone database: nothing bundled.
jiff = { version = "0.2.38", default-features = false, features = [
    "std",
    "tz-system",
    "tzdb-zoneinfo",
] }
thiserror = "2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
