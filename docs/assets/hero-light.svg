.ln { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 24px; white-space: pre; }
/* plays once, then holds: the last frame is the file as written */
@media (prefers-reduced-motion: no-preference) {
  .s { animation: draw 1.5s cubic-bezier(.22, .61, .36, 1) both; }
  .sb { animation-delay: .15s; } .sc { animation-delay: .3s; }
  .tag { animation: show .8s ease-out .45s both; }
  .url { animation: show .8s ease-out .8s both; }
  .term { animation: show .5s ease-out 1s both; }
  .ln { animation: show .3s ease-out both; }
}
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes show { from { opacity: 0; } to { opacity: 1; } }
</style>
