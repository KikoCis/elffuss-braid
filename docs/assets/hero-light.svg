<title id="hero-title">Elffuss Braid: Many agents. One main. No retry loop.</title>
<desc id="hero-desc">Three agents land on main in turn: agent-a as a fast-forward, agent-b rebased onto it, and agent-c with a conflict, so main did not move and braid exits with status 2.</desc>
<style>
.s { fill: none; stroke-width: 9.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 2; stroke-dashoffset: 0; }
