# cargo-deny configuration: which licences, sources and crates braid accepts.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Everything here is compatible with Apache-2.0. GPL, LGPL and AGPL are not
# listed, so they fail the check.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # libgit2 is GPLv2 with a linking exception and C; braid uses gitoxide.
    { crate = "git2", reason = "braid uses gitoxide for git interop" },
    { crate = "libgit2-sys", reason = "braid uses gitoxide for git interop" },
    { crate = "openssl-sys", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
