[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/KikoCis/elffuss-braid"
homepage = "https://elffuss.com"
publish = false

[workspace.dependencies]
braid-format = { package = "elffuss-braid-format", path = "crates/format" }
braid-engine = { package = "elffuss-braid-engine", path = "crates/engine" }
braid-store = { package = "elffuss-braid-store", path = "crates/store" }
braid-repo = { package = "elffuss-braid-repo", path = "crates/repo" }
braid-git = { package = "elffuss-braid-git", path = "crates/git" }
braid-wc = { package = "elffuss-braid-wc", path = "crates/wc" }
braid-hubproto = { package = "elffuss-braid-hubproto", path = "crates/hubproto" }
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
unicode-normalization = "0.1"
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

# Hashing, compression and chunking run optimised even in debug builds, so
# tests that store large blobs stay quick.
[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.zstd-sys]
opt-level = 3

[profile.dev.package.fastcdc]
opt-level = 3

[profile.dev.package.crc32c]
opt-level = 3
