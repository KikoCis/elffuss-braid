[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/KikoCis/elffuss-braid"
homepage = "https://elffuss.com"
publish = false

[workspace.dependencies]
braid-format = { package = "elffuss-braid-format", path = "crates/format" }
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
